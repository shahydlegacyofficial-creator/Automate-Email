name: Build Android app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TravelEssenceMail.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/TravelEssenceMail-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TravelEssenceMail-android
          path: android/dist/TravelEssenceMail.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/dist/TravelEssenceMail-debug.apk

      - name: Commit APK for direct download
        if: "!startsWith(github.ref, 'refs/tags/') && contains(github.event.head_commit.message, '[apk]')"
        working-directory: .
        run: |
          mkdir -p downloads
          cp android/dist/TravelEssenceMail.apk downloads/TravelEssenceMail.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/TravelEssenceMail.apk
          git commit -m "Add Android APK build [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish release
        id: publish
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          name: Travel Essence Email Studio ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: android/dist/TravelEssenceMail.apk
      - name: Wait before retrying release upload
        if: steps.publish.outcome == 'failure'
        run: sleep 45
      - name: Publish release (retry)
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          name: Travel Essence Email Studio ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: android/dist/TravelEssenceMail.apk

  screenshots:
    needs: build
    if: "!startsWith(github.ref, 'refs/tags/') && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]'))"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug
      - name: Place debug APK
        run: mv android/app/build/outputs/apk/debug/TravelEssenceMail-debug.apk android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: bash scripts/screenshots.sh
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/android-screenshots
          git commit -m "Update Android screenshots [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
