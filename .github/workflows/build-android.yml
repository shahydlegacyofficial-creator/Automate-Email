name: Build Android app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v1.0.0). Leave empty for a normal build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        env:
          MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/LegacyAIEmailStudio.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/LegacyAIEmailStudio-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LegacyAIEmailStudio-android
          path: android/dist/LegacyAIEmailStudio.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/dist/LegacyAIEmailStudio-debug.apk

      # Google Play bundle. Signed with the upload key when the repository secrets exist (see PLAY_SUBMISSION.md),
      # otherwise built unsigned so it can be signed with the upload key afterwards - never with the public APK key.
      - name: Build Google Play bundle (AAB)
        env:
          MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export ANDROID_UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
            NAME=LegacyAIEmailStudio-play.aab
          else
            echo "::notice::No upload-key secrets - the Play bundle is UNSIGNED. Add the secrets in PLAY_SUBMISSION.md to sign it here."
            NAME=LegacyAIEmailStudio-play-unsigned.aab
          fi
          ./gradlew --no-daemon -Pplay bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
          cp app/build/outputs/bundle/release/app-release.aab "dist/$NAME"
          cp app/build/outputs/mapping/release/mapping.txt dist/LegacyAIEmailStudio-play-mapping.txt
          echo "### Google Play bundle: \`$NAME\` (artifact **LegacyAIEmailStudio-play**)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: LegacyAIEmailStudio-play
          path: |
            android/dist/*.aab
            android/dist/LegacyAIEmailStudio-play-mapping.txt
          if-no-files-found: error

      - name: Commit Play bundle for signing
        if: "!startsWith(github.ref, 'refs/tags/') && contains(github.event.head_commit.message, '[aab]')"
        working-directory: .
        run: |
          mkdir -p downloads/play
          cp android/dist/*.aab android/dist/LegacyAIEmailStudio-play-mapping.txt downloads/play/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/play
          git commit -m "Add Play bundle build [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Commit APK for direct download
        if: "!startsWith(github.ref, 'refs/tags/') && contains(github.event.head_commit.message, '[apk]')"
        working-directory: .
        run: |
          mkdir -p downloads
          cp android/dist/LegacyAIEmailStudio.apk downloads/LegacyAIEmailStudio.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/LegacyAIEmailStudio.apk
          git commit -m "Add Android APK build [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish release
        id: publish
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Legacy AI Email Studio ${{ inputs.release_tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: android/dist/LegacyAIEmailStudio.apk
      - name: Wait before retrying release upload
        if: steps.publish.outcome == 'failure'
        run: sleep 45
      - name: Publish release (retry)
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Legacy AI Email Studio ${{ inputs.release_tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: android/dist/LegacyAIEmailStudio.apk

  screenshots:
    needs: build
    if: "!startsWith(github.ref, 'refs/tags/') && ((github.event_name == 'workflow_dispatch' && !inputs.release_tag) || contains(github.event.head_commit.message, '[screenshots]'))"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug
      - name: Place debug APK
        run: mv android/app/build/outputs/apk/debug/LegacyAIEmailStudio-debug.apk android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: bash scripts/screenshots.sh
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/android-screenshots
          git commit -m "Update Android screenshots [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  fgs-video:
    needs: build
    if: "!startsWith(github.ref, 'refs/tags/') && contains(github.event.head_commit.message, '[video]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug
      - name: Place debug APK
        run: mv android/app/build/outputs/apk/debug/LegacyAIEmailStudio-debug.apk android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record the foreground-service demo on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: bash scripts/fgs_demo.sh
      - name: Commit the recording
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/play
          git commit -m "Foreground-service demo recording [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
