name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "android/**"
      - "docs/android-screenshots/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths-ignore:
      - "android/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v1.0.0). Leave empty for a normal build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/LegacyAIEmailStudio.spec

      - name: Smoke test - launch the exe
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "smoke.txt"
          $env:TE_SMOKE_TEST = $report
          $p = Start-Process -FilePath "dist\LegacyAIEmailStudio.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "App did not exit within 2 minutes" }
          if ($p.ExitCode -ne 0) { throw "App exited with code $($p.ExitCode)" }
          Get-Content $report
          if (-not (Select-String -Path $report -Pattern "outlook_com=ok" -Quiet)) { throw "Outlook COM support missing from build" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: LegacyAIEmailStudio-windows
          path: |
            dist/LegacyAIEmailStudio.exe
            dist/LegacyAIEmailStudio-Setup.exe
          if-no-files-found: error

      - name: Publish release
        id: publish
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Legacy AI Email Studio ${{ inputs.release_tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/LegacyAIEmailStudio.exe
            dist/LegacyAIEmailStudio-Setup.exe
      - name: Wait before retrying release upload
        if: steps.publish.outcome == 'failure'
        run: sleep 45
      - name: Publish release (retry)
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Legacy AI Email Studio ${{ inputs.release_tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/LegacyAIEmailStudio.exe
            dist/LegacyAIEmailStudio-Setup.exe
